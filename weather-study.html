<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Rainpane · Wet glass study</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:24px;background:#151c20;color:#dce6e4;font:14px system-ui}header{max-width:1200px;margin:0 auto 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}h1{font:24px Georgia;margin:0 auto 0 0}button,select{font:inherit;color:inherit;background:#263437;border:1px solid #526061;border-radius:7px;padding:8px 12px}#pane{position:relative;width:min(1200px,100%);height:760px;max-height:78vh;margin:auto;overflow:hidden;border-radius:12px;background:linear-gradient(180deg,#789baf 0%,#65878f 26%,#345655 54%,#162b34 72%,#0c1927 100%)}#pane:before{content:'';position:absolute;inset:38% -10% -10%;filter:blur(20px);background:repeating-linear-gradient(95deg,transparent 0 7%,#172d35 8% 13%,transparent 14% 23%);opacity:.75}.lights{position:absolute;inset:42% 0 5%;filter:blur(9px);background:radial-gradient(circle at 14% 70%,#fbc570 0 7px,transparent 20px),radial-gradient(circle at 46% 44%,#ffd287 0 13px,transparent 32px),radial-gradient(circle at 66% 61%,#ffcb76 0 8px,transparent 22px),radial-gradient(circle at 85% 74%,#facd8c 0 16px,transparent 32px),radial-gradient(circle at 35% 87%,#f39d58 0 8px,transparent 24px)}canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}#pane.plain{background:linear-gradient(90deg,#e9e9e3 0 50%,#26333d 50%)}#pane.plain:before,#pane.plain .lights{display:none}.focus{position:absolute;left:10%;top:25%;width:35%;height:50%;padding:30px;background:#edece5;color:#253431;display:none}.focused .focus{display:block}.focus-right .focus{left:50%}p{max-width:1200px;margin:18px auto;color:#a4b7b8}
